<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kisyza Legal</title>
  <style>
    :root { --ink:#1c1410; --muted:#6f6158; --line:#e4d5c6; --accent:#d21d5a; --bg:#fffaf4; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { max-width: 720px; margin: 0 auto; padding: 48px 20px 80px; }
    p.chip { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .08em; color: var(--accent); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; }
    h1 { font-size: 32px; letter-spacing: -.03em; margin: 12px 0 8px; }
    .muted { color: var(--muted); }
    .card { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 18px; margin: 14px 0; }
    a { color: var(--accent); font-weight: 650; text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main>
    <p class="chip">KISYZA</p>
    <h1>Legal</h1>
    <p class="muted">Last updated: 9 September 2026</p>
    <div class="card">
      <h2>Terms of Use</h2>
      <p class="muted">The agreement that governs use of the Kisyza app.</p>
      <p><a href="terms.html">Read Terms of Use →</a></p>
    </div>
    <div class="card">
      <h2>Privacy Policy</h2>
      <p class="muted">How Kisyza handles information on your device.</p>
      <p><a href="privacy.html">Read Privacy Policy →</a></p>
    </div>
  </main>
</body>
</html>
